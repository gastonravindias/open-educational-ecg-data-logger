<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<style>text{font-family:Arial,sans-serif;fill:#111}.box{fill:white;stroke:#111;stroke-width:2;rx:12;ry:12}.line{stroke:#111;stroke-width:2;fill:none;marker-end:url(#a)}.small{font-size:18px}.title{font-size:28px;font-weight:bold}.head{font-size:21px;font-weight:bold}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs>
<text x="700" y="45" text-anchor="middle" class="title">Reference connection diagram — educational ECG core</text>
<rect class="box" x="500" y="100" width="390" height="610"/><text x="695" y="145" text-anchor="middle" class="head">ESP32-C3 SuperMini</text>
<text x="530" y="200" class="small">GPIO0 — AD8232 OUT</text><text x="530" y="240" class="small">GPIO1 — AD8232 LO+</text><text x="530" y="280" class="small">GPIO3 — AD8232 LO−</text><text x="530" y="320" class="small">GPIO10 — AD8232 SDN</text>
<text x="530" y="380" class="small">GPIO20 — I²C SDA</text><text x="530" y="420" class="small">GPIO21 — I²C SCL</text>
<text x="530" y="480" class="small">GPIO4 — microSD SCK</text><text x="530" y="520" class="small">GPIO5 — microSD MISO</text><text x="530" y="560" class="small">GPIO6 — microSD MOSI</text><text x="530" y="600" class="small">GPIO7 — microSD CS</text><text x="530" y="650" class="small">GPIO2 — active-low buzzer IN</text>
<rect class="box" x="55" y="150" width="330" height="150"/><text x="220" y="195" text-anchor="middle" class="head">AD8232 breakout</text><text x="220" y="235" text-anchor="middle" class="small">3.3 V / GND • OUT • LO+ • LO− • SDN</text><line class="line" x1="385" y1="225" x2="500" y2="225"/>
<rect class="box" x="55" y="370" width="330" height="120"/><text x="220" y="415" text-anchor="middle" class="head">ECG simulator</text><text x="220" y="452" text-anchor="middle" class="small">RA/LA/RL-style terminals</text><line class="line" x1="220" y1="370" x2="220" y2="300"/>
<rect class="box" x="1000" y="100" width="330" height="105"/><text x="1165" y="145" text-anchor="middle" class="head">SSD1306 OLED</text><text x="1165" y="180" text-anchor="middle" class="small">3.3 V / GND • SDA • SCL</text><line class="line" x1="890" y1="390" x2="1000" y2="152"/>
<rect class="box" x="1000" y="250" width="330" height="105"/><text x="1165" y="295" text-anchor="middle" class="head">DS3231 RTC</text><text x="1165" y="330" text-anchor="middle" class="small">3.3 V-compatible • SDA • SCL</text><line class="line" x1="890" y1="405" x2="1000" y2="302"/>
<rect class="box" x="1000" y="400" width="330" height="105"/><text x="1165" y="445" text-anchor="middle" class="head">INA219 (optional)</text><text x="1165" y="480" text-anchor="middle" class="small">3.3 V • SDA • SCL</text><line class="line" x1="890" y1="420" x2="1000" y2="452"/>
<rect class="box" x="1000" y="550" width="330" height="120"/><text x="1165" y="595" text-anchor="middle" class="head">microSD module</text><text x="1165" y="635" text-anchor="middle" class="small">SCK / MISO / MOSI / CS</text><line class="line" x1="890" y1="520" x2="1000" y2="610"/>
<rect class="box" x="55" y="610" width="330" height="120"/><text x="220" y="655" text-anchor="middle" class="head">Protected battery source</text><text x="220" y="695" text-anchor="middle" class="small">regulator set and verified to 3.3 V</text><line class="line" x1="385" y1="670" x2="500" y2="670"/>
<text x="700" y="825" text-anchor="middle" class="small">No human attachment. Disconnect lead cable before USB programming or charging.</text></svg>